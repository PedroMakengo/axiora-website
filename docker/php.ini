; Axiora — PHP em produção (contentor)
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 256M
max_execution_time = 60

; Imagens até 4MB (capas, slides, editor) — com margem para o resto do formulário
upload_max_filesize = 6M
post_max_size = 8M

date.timezone = Africa/Luanda

; Sessões no volume "storage": não se perdem a cada deploy
session.save_path = /var/www/html/storage/sessoes
session.gc_maxlifetime = 43200

opcache.enable = 1
opcache.memory_consumption = 96
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
